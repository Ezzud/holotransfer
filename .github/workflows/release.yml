name: Release HoloTransfer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-13
            platform: darwin-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').copyFileSync('apps/web/.env.tauri.example', 'apps/web/.env.tauri')"
      - run: pnpm version:sync
      - run: node scripts/set-tauri-updater-key.mjs
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      - run: pnpm --filter @holotransfer/desktop tauri build --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error

  release:
    name: Publish release and updater manifest
    needs:
      - desktop
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - run: node scripts/create-updater-manifest.mjs
        env:
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_MANIFEST: latest.json
          RELEASE_VERSION: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*
            latest.json

  android:
    name: Build Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973
      - run: rustup target add aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').copyFileSync('apps/web/.env.tauri.example', 'apps/web/.env.tauri')"
      - run: pnpm version:sync
      - run: pnpm --filter @holotransfer/desktop tauri android init
      - name: Restore Android signing keystore
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/holotransfer-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: pnpm --filter @holotransfer/desktop tauri android build --ci --target aarch64 --apk
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/holotransfer-release.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/desktop/src-tauri/gen/android/**/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS
    if: ${{ false }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').copyFileSync('apps/web/.env.tauri.example', 'apps/web/.env.tauri')"
      - run: pnpm version:sync
      - run: pnpm --filter @holotransfer/desktop tauri ios init
      - run: pnpm --filter @holotransfer/desktop tauri ios build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apps/desktop/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
