name: Release HoloTransfer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version_check:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: compare
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const packageJson = JSON.parse(
              fs.readFileSync("package.json", "utf8"),
            );
            const version = packageJson.version;
            let latestVersion = "";

            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              latestVersion = latestRelease.data.tag_name.replace(/^v/, "");
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const shouldBuild = version !== latestVersion;
            core.setOutput("version", version);
            core.setOutput("should_build", String(shouldBuild));
            core.notice(
              `Package version: ${version}; latest release: ${latestVersion || "none"}; build: ${shouldBuild}`,
            );

  desktop:
    name: Build ${{ matrix.platform }}
    needs: version_check
    if: needs.version_check.outputs.should_build == 'true'
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            config: tauri.linux.conf.json
          - os: windows-latest
            platform: windows-x86_64
            config: tauri.windows.conf.json
          - os: macos-latest
            platform: darwin-x86_64
            config: tauri.macos.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> apps/desktop/src-tauri/target
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').copyFileSync('apps/web/.env.tauri.example', 'apps/web/.env.tauri')"
      - run: pnpm version:sync
      - run: pnpm --filter @holotransfer/desktop tauri build --ci --config src-tauri/tauri.conf.json --config src-tauri/${{ matrix.config }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error

  release:
    name: Publish release and updater manifest
    needs:
      - version_check
      - desktop
      - android
    if: needs.version_check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Stage release assets
        run: node scripts/stage-release-assets.mjs
        env:
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_OUTPUT_DIR: release-upload
      - run: node scripts/create-updater-manifest.mjs
        env:
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_MANIFEST: latest.json
          RELEASE_VERSION: ${{ needs.version_check.outputs.version }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version_check.outputs.version }}
          generate_release_notes: true
          files: |
            release-upload/**/*
            latest.json

  android:
    name: Build Android
    needs: version_check
    if: needs.version_check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
      - run: rustup target add aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').copyFileSync('apps/web/.env.tauri.example', 'apps/web/.env.tauri')"
      - run: pnpm version:sync
      - run: pnpm --filter @holotransfer/desktop tauri android init
      - name: Restore Android signing keystore
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/holotransfer-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: pnpm --filter @holotransfer/desktop tauri android build --ci --target aarch64 --apk
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/holotransfer-release.jks
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/desktop/src-tauri/gen/android/**/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS
    if: ${{ false }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').copyFileSync('apps/web/.env.tauri.example', 'apps/web/.env.tauri')"
      - run: pnpm version:sync
      - run: pnpm --filter @holotransfer/desktop tauri ios init
      - run: pnpm --filter @holotransfer/desktop tauri ios build --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apps/desktop/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
